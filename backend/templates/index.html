<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT Sensor Dashboard 2026</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.pubnub.com/sdk/javascript/pubnub.7.2.2.min.js"></script>
</head>
<body class="bg-dark text-white p-4">
    <div class="container">
        <h1 class="mb-4 text-center">IoT Real-Time Telemetry Dashboard</h1>
        
        <div class="row mb-4">
            <div class="col-md-6 mb-3">
                <div class="card bg-secondary text-white border-light">
                    <div class="card-body text-center">
                        <h5 class="card-title">Temperature</h5>
                        <h2 class="display-4"><span id="temp-val">--</span> °C</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-6 mb-3">
                <div class="card bg-secondary text-white border-light">
                    <div class="card-body text-center">
                        <h5 class="card-title">Light Level</h5>
                        <h2 class="display-4"><span id="light-val">--</span> Lux</h2>
                    </div>
                </div>
            </div>
        </div>

        <div class="card bg-secondary p-3">
            <canvas id="telemetryChart" width="400" height="150"></canvas>
        </div>
    </div>

    <script>
        const ctx = document.getElementById('telemetryChart').getContext('2d');
        const telemetryChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    {
                        label: 'Temperature (°C)',
                        data: [],
                        borderColor: 'rgb(255, 99, 132)',
                        tension: 0.2
                    },
                    {
                        label: 'Light Level (Lux)',
                        data: [],
                        borderColor: 'rgb(54, 162, 235)',
                        tension: 0.2
                    }
                ]
            },
            options: {
                scales: {
                    x: { ticks: { color: 'white' } },
                    y: { ticks: { color: 'white' } }
                },
                plugins: {
                    legend: { labels: { color: 'white' } }
                }
            }
        });

        async function initDashboard() {
            try {
                // 1. Fetch valid PAM token from Flask API endpoint
                const res = await fetch('/api/get-device-token');
                const tokenResponse = await res.json();

                if (!tokenResponse.token) {
                    console.error("Failed to retrieve access token from backend:", tokenResponse);
                    return;
                }

                // 2. Initialize PubNub with token passed directly
                const pubnub = new PubNub({
                    subscribeKey: "{{ config['PUBNUB_SUBSCRIBE_KEY'] }}",
                    cipherKey: "{{ config['PUBNUB_CIPHER_KEY'] }}",
                    authToken: tokenResponse.token,
                    userId: "esp32-sensor-01"
                });

                // Set token explicitly for JS SDK compatibility
                pubnub.setToken(tokenResponse.token);

                // 3. Add Status and Message Listener
                pubnub.addListener({
                    status: function(statusEvent) {
                        console.log("PubNub Status Event:", statusEvent.category);
                        if (statusEvent.category === "PNConnectedCategory") {
                            console.log("Successfully connected and subscribed to channel!");
                        }
                    },
                    message: function(event) {
                        console.log("Raw Message Received:", event.message);

                        // Support both dictionary object and stringified JSON payloads
                        let data = event.message;
                        if (typeof data === 'string') {
                            try {
                                data = JSON.parse(data);
                            } catch (e) {
                                console.error("Error parsing message payload:", e);
                            }
                        }

                        const timeStr = new Date(data.timestamp * 1000).toLocaleTimeString();

                        // Update text counters
                        document.getElementById('temp-val').innerText = data.temperature;
                        document.getElementById('light-val').innerText = data.light_level;

                        // Shift old graph data points if over 10 values
                        if (telemetryChart.data.labels.length > 10) {
                            telemetryChart.data.labels.shift();
                            telemetryChart.data.datasets[0].data.shift();
                            telemetryChart.data.datasets[1].data.shift();
                        }

                        // Append new reading to graph
                        telemetryChart.data.labels.push(timeStr);
                        telemetryChart.data.datasets[0].data.push(data.temperature);
                        telemetryChart.data.datasets[1].data.push(data.light_level);
                        telemetryChart.update();
                    }
                });

                // 4. Subscribe to the telemetry stream channel
                pubnub.subscribe({
                    channels: ['sensor-data']
                });
            } catch (err) {
                console.error("PubNub init error:", err);
            }
        }

        initDashboard();
    </script>
</body>
</html>
