<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT Sensor Dashboard 2026</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.pubnub.com/sdk/javascript/pubnub.7.2.2.min.js"></script>
</head>
<body class="bg-dark text-white p-4">
    <div class="container">
        <h1 class="mb-4 text-center">Adil's IRISH HOME temperature and Humidity</h1>
        
        <div class="row mb-3">
            <div class="col-md-6 mb-3">
                <div class="card bg-secondary text-white border-light">
                    <div class="card-body text-center">
                        <h5 class="card-title">Temperature</h5>
                        <h2 class="display-4"><span id="temp-val">--</span> °C</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-6 mb-3">
                <div class="card bg-secondary text-white border-light">
                    <div class="card-body text-center">
                        <h5 class="card-title">Humidity</h5>
                        <h2 class="display-4"><span id="humidity-val">--</span> %</h2>
                    </div>
                </div>
            </div>
        </div>

        <div class="card bg-secondary p-3">
            <canvas id="telemetryChart" width="400" height="150"></canvas>
        </div>
    </div>

    <script>
        const ctx = document.getElementById('telemetryChart').getContext('2d');
        const telemetryChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    {
                        label: 'Temperature (°C)',
                        data: [],
                        borderColor: 'rgb(255, 99, 132)',
                        tension: 0.2
                    },
                    {
                        label: 'Humidity (%)',
                        data: [],
                        borderColor: 'rgb(54, 162, 235)',
                        tension: 0.2
                    }
                ]
            },
            options: {
                scales: {
                    x: { ticks: { color: 'white' } },
                    y: { ticks: { color: 'white' } }
                },
                plugins: {
                    legend: { labels: { color: 'white' } }
                }
            }
        });

        async function initDashboard() {
            try {
                // Initialize PubNub with dedicated dashboard UUID
                const pubnub = new PubNub({
                    subscribeKey: "{{ config.PUBNUB_SUBSCRIBE_KEY }}",
                    cipherKey: "{{ config.PUBNUB_CIPHER_KEY }}",
                    userId: "web-dashboard-client-" + Math.floor(Math.random() * 1000)
                });

                // Add Status and Message Listener
                pubnub.addListener({
                    status: function(statusEvent) {
                        console.log("PubNub Status Event:", statusEvent.category);
                    },
                    message: function(event) {
                        console.log("Raw Message Received:", event.message);

                        let data = event.message;
                        if (typeof data === 'string') {
                            try { data = JSON.parse(data); } catch (e) {}
                        }

                        const timeStr = new Date().toLocaleTimeString();

                        // Update text DOM elements safely
                        if (data.temperature !== undefined) {
                            document.getElementById('temp-val').innerText = data.temperature;
                        }
                        if (data.humidity !== undefined) {
                            document.getElementById('humidity-val').innerText = data.humidity;
                        }

                        // Keep max 10 graph data points
                        if (telemetryChart.data.labels.length > 10) {
                            telemetryChart.data.labels.shift();
                            telemetryChart.data.datasets[0].data.shift();
                            telemetryChart.data.datasets[1].data.shift();
                        }

                        // Plot new temperature & humidity readings
                        telemetryChart.data.labels.push(timeStr);
                        telemetryChart.data.datasets[0].data.push(data.temperature || 0);
                        telemetryChart.data.datasets[1].data.push(data.humidity || 0);
                        telemetryChart.update();
                    }
                });

                // Subscribe to telemetry stream
                pubnub.subscribe({
                    channels: ['sensor-data']
                });
            } catch (err) {
                console.error("PubNub init error:", err);
            }
        }

        window.addEventListener('DOMContentLoaded', initDashboard);
    </script>
</body>
</html>
